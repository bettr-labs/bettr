spring:
  application:
    name: bettr-api
  main:
    banner-mode: log
    web-application-type: REACTIVE
  web:
    resources:
      add-mappings: false
  data:
    mongodb:
      uri: mongodb+srv://${MDB_USER}:${MDB_PASSWORD}@cluster0.ya3dzqm.mongodb.net/bettr?appName=${MDBCLUSTER:Cluster0}
      database: bettr
server:
  port: ${PORT:8080}

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  endpoints:
    web:
      base-path: /actuator/
      exposure:
        include: "*"
    prometheus:
      exposure:
        include: "*"
  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true

endpoints:
  prometheus:
    enabled: true

logging:
  level:
    root: INFO
    org.javamoney.moneta: WARN
  config: "classpath:${LOGGING_CONFIG_FILE:log4j2.xml}"
